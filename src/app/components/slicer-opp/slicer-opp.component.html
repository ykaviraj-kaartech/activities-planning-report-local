<div class="slicers-container" >
  <ng-container *ngFor = "let sname of slicerNames" >
      <mat-card style="width: fit-content;margin-top: 20px;margin-left: 10px; padding-top: 1%;padding: 0px;font-family: DM Sans !important; border: 1px solid #DCDCDC; box-shadow: 0 2px 1px -1px rgba(0, 0, 0, .2), 0 1px 1px 0 rgba(0, 0, 0, .14), 0 1px 3px 0 rgba(0, 0, 0, .12);">
        <mat-card-content style="height: 14rem;">

        <div style="background-color: #f5f6f9; border-radius: 4px; display: flex; align-items: center; margin: 5px; flex-wrap: wrap; padding: 4px 6px;">
          <div (click)="toggleSearchInput(sname)" style="flex-grow: 1; cursor: pointer; display: flex; align-items: center; white-space: nowrap;">
            <mat-icon 
              style="height: 21px; width: 21px; font-size: 21px; user-select: none; color: #7D838B; margin-top: 0px;">
              search
            </mat-icon>
            <span 
              style="font-size: 14px; font-weight: 500; user-select: none; color: #898782; margin-left: 4px;">
              {{ sname === 'ClosureDate' ? 'Closure Date' : sname === 'SubmissionDate' ? 'Submission Date' : sname === 'SO' ? 'Sales Org' : sname }}
            </span>
          </div>
          <div style="display: flex; gap: 4px;">
            <mat-icon 
              class="material-symbols-outlined hover-pointer" 
              style="font-size: 21px; margin-top: 2px;"
              [ngClass]="{'iconClicked': filterConfig[sname], 'iconNClicked': !filterConfig[sname]}" 
              (click)="clearSlicerFunc(sname)">
              filter_alt_off
            </mat-icon>
          </div>
        </div>

        <div *ngIf="searchStates[sname]" style="width: 11.5rem; margin: 0px 4px 4px 6px;">
          <input 
            type="text" 
            (input)="searchEvent($event, sname)" 
            placeholder="Search..." 
            style="width: 100%; padding: 4px; border: 1px solid #dcdcdc; border-radius: 4px; font-style: italic;">
        </div>

          <cdk-virtual-scroll-viewport itemSize="40" class="example-viewport">
            <div *cdkVirtualFor="let item of slicerData[sname]" class="example-item">
              <button *ngIf="item.name && item.isClicked" style = "font-family: 'DM Sans';" mat-button (click)="slicerFilter(item,sname)"
                [ngClass]="{'isClicked': item.isSelected,'isnClicked':!item.isSelected}">
                {{item.name}}
              </button>
            </div>
          </cdk-virtual-scroll-viewport>
        </mat-card-content>
      </mat-card>
  </ng-container>
</div>
