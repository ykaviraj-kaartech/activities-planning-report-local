<div #ganttContainer class="gantt-chart-style">
    <div class="d-flex justify-content-between mb-3 mx-3">
        <div class="my-auto">
            <div class="d-flex">
                <button class="custom-back-btn mr-3" (click)="backToReportsLandingPage()">
                    <div style="position: relative; top: 2px">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <g id="Group">
                            <path id="Vector" d="M7.21834 7.99999L10.5183 11.3L9.57567 12.2427L5.33301 7.99999L9.57567 3.75732L10.5183 4.69999L7.21834 7.99999Z" fill="#45546E"/>
                            </g>
                        </svg>
                        Back
                    </div>
                </button>
                <div class="d-flex mt-1 align-items-center" style="gap: 10px; cursor: pointer" [matMenuTriggerFor]="newitems">
                    <div class="current-tab-heading">
                        {{ tab }}
                    </div>
                    <div style="position: relative; top: -2px;" >
                        <svg xmlns="http://www.w3.org/2000/svg" width="10" height="8" viewBox="0 0 10 8" fill="none">
                            <path d="M5 4.75033L8.83333 0.916992L10 2.08366L5 7.08366L0 2.08366L1.16667 0.916992L5 4.75033Z" fill="#7D838B"/>
                        </svg>
                    </div>
                </div>
                <mat-menu #newitems="matMenu" class="new-items-panel">
                    <!-- <div class="card"> -->
                        <!-- <div class="card-body p-0"> -->
                        <button mat-menu-item (click)="changeTabToPeople()">
                            <span style="font-family: DM Sans;">People</span>
                        </button>
                        <button mat-menu-item (click)="changeTabToOpportunities()">
                            <span style="font-family: DM Sans;">Opportunities</span>
                        </button>
                        <button mat-menu-item (click)="changeTabToLeads()">
                            <span style="font-family: DM Sans;">Leads</span>
                        </button>
                          <button mat-menu-item (click)="changeTabToAccounts()">
                            <span style="font-family: DM Sans;">Accounts</span>
                        </button>
                        <!-- </div> -->
                    <!-- </div> -->
                </mat-menu>
            </div>
        </div>
		<div class="d-flex align-items-center px-2" style="gap: 16px;">
            <!-- <div>
                <button (click)="toggleTaskNonWorkingTime()">Toggle Non-Working Time</button>
            </div> -->
            <div>
                <mat-form-field appearance="outline" class="search-bar ml-auto">
                    <span matSuffix>
                      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26" fill="none">
                        <g clip-path="url(#clip0_12265_94744)">
                        <path d="M16.828 16.0782L19.6833 18.9328L18.74 19.8762L15.8853 17.0208C14.8231 17.8723 13.502 18.3354 12.1406 18.3335C8.82863 18.3335 6.14062 15.6455 6.14062 12.3335C6.14062 9.0215 8.82863 6.3335 12.1406 6.3335C15.4526 6.3335 18.1406 9.0215 18.1406 12.3335C18.1426 13.6948 17.6794 15.016 16.828 16.0782ZM15.4906 15.5835C16.3367 14.7134 16.8092 13.5471 16.8073 12.3335C16.8073 9.75483 14.7186 7.66683 12.1406 7.66683C9.56196 7.66683 7.47396 9.75483 7.47396 12.3335C7.47396 14.9115 9.56196 17.0002 12.1406 17.0002C13.3542 17.0021 14.5205 16.5296 15.3906 15.6835L15.4906 15.5835V15.5835Z" fill="#EE4961"/>
                        </g>
                        <defs>
                        <clipPath id="clip0_12265_94744">
                        <rect width="16" height="16" fill="white" transform="translate(4.80859 5)"/>
                        </clipPath>
                        </defs>
                      </svg>
                    </span>
                    <input matInput type="text" (input)="onSearch($event)" placeholder="Search Tasks / Opportunities">
                  </mat-form-field>
            </div>

            <div class="col-1 slicer-container" (click)="supressSlicer()">
                <span style="color: #5F6C81;" class="material-symbols-outlined" *ngIf="!isSlicerOn">
                    <mat-icon style="height: 18px; width: 24px;">
                      filter_list
                    </mat-icon>
                </span>
                <span style="color: #5F6C81;" class="material-symbols-outlined" *ngIf="isSlicerOn">
                    <mat-icon style="height: 18px; width: 24px;">
                      filter_list_off
                    </mat-icon>
                </span>
            </div>
            <div *ngIf="isResetButtonPresent">
                <button class="reset-button" (click)="clearAllFilters()">
                  Reset All Filters
                </button>
            </div> 

			<div class="button-group">
                <button 
					mat-button 
					(click)="toggleView('hourAndDay')" 
					class="time-range-button" 
					[class.active]="ganttCmp?.instance?.timeAxis?.viewPreset?.id === 'hourAndDay'"
				>
					<mat-icon>date_range</mat-icon> Day
				</button>
				<button 
					mat-button 
					(click)="toggleView('weekAndDayLetter')" 
					class="time-range-button" 
					[class.active]="ganttCmp?.instance?.timeAxis?.viewPreset?.id === 'weekAndDayLetter'"
				>
					<mat-icon>date_range</mat-icon> Weeks
				</button>
				<button 
					mat-button 
					(click)="toggleView('monthAndYear')" 
					class="time-range-button" 
					[class.active]="ganttCmp?.instance?.timeAxis?.viewPreset?.id === 'monthAndYear'"
				>
					<mat-icon>calendar_month</mat-icon> Months
				</button>
			</div>

                         {{ months[selectedMonthIndex] }}
                         {{ selectedYear }}
                 </mat-button>
             </div>

            <div class="d-flex align-items-center">
                <span class="date-text">{{ startDateForData | date:'dd-MM-yyyy' }}</span>
                <button (click)="openStartPicker($event)" style="background:none; border:none; cursor:pointer;">
                <mat-icon>calendar_today</mat-icon>
                </button>

                <input 
                #startInput
                matInput 
                [matDatepicker]="startPicker" 
                [(ngModel)]="startDateForData" 
                (dateChange)="onStartDateChange($event)"
                style="position:absolute; opacity:0; width:1px; height:1px; border:none; padding:0; margin:0;" 
                />

                <mat-datepicker #startPicker></mat-datepicker>
            </div>
            <div>
                <span class="date-text">to</span>
            </div>
            <div class="d-flex align-items-center">

                <span class="date-text">{{ endDateForData | date:'dd-MM-yyyy' }}</span>
                <button (click)="openEndPicker($event)" style="background:none; border:none; cursor:pointer;">
                <mat-icon>calendar_today</mat-icon>
                </button>

                <input 
                #endInput
                matInput 
                [matDatepicker]="endPicker" 
                [(ngModel)]="endDateForData" 
                (dateChange)="onEndDateChange($event)"
                style="position:absolute; opacity:0; width:1px; height:1px; border:none; padding:0; margin:0;" 
                />

                <mat-datepicker #endPicker></mat-datepicker>
            </div>

			<button class="px-1 create-task-btn" matTooltip="Create Task" (click)="createTask()">
				Create Task
			</button> 
		</div>
	</div>
    <div  [ngStyle]="{ visibility: isLoading == true? 'visible' : 'hidden' }">
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
    <div *ngIf="!isSlicerLoading && isSlicerOn">
        <app-slicer-opp style="margin-top:-2vh;" [slicerData]="slicerData" [filterConfig]="filterConfig"
            (combinedEvent)="handleCombinedEvent($event)" (clearSlicer)="clearSlicer($event)"></app-slicer-opp>
    </div>
    <!-- <input type="text" (input)="onSearch($event)" placeholder="Search Tasks / Opportunities"> -->
    <bryntum-gantt *ngIf="tab === 'Opportunities' && !isRefreshNeeded"
        id="bryntum-gantt"
        class="bryntum-gantt"
        style="height: 80vh;"
        #gantt
        [columns]                 = "ganttProps.columns"
        [endDate]                 = "ganttProps.endDate"
        [project]                 = "ganttProps.project"
        [startDate]               = "ganttProps.startDate"
        [projectLinesFeature]     = "ganttProps.features.projectLines"
        [scrollButtonsFeature]    = "ganttProps.features.scrollButtons"
        [labelsFeature]           = "ganttProps.features.labels"
        [taskTooltipFeature]      = "ganttProps.features.taskTooltip"
        [taskEditFeature]         = "ganttProps.features.taskEdit"
        [dependenciesFeature]     = "ganttProps.features.dependencies"
        (ready)="onGanttReady($event)"
    ></bryntum-gantt>
    <bryntum-gantt *ngIf="tab === 'People' && !isRefreshNeeded"
        id="bryntum-gantt"
        class="bryntum-gantt"
        style="height: 80vh;"
        #gantt
        [columns]                 = "ganttProps.columns"
        [endDate]                 = "ganttProps.endDate"
        [project]                 = "ganttProps.project"
        [startDate]               = "ganttProps.startDate"
        [projectLinesFeature]     = "ganttProps.features.projectLines"
        [scrollButtonsFeature]    = "ganttProps.features.scrollButtons"
        [labelsFeature]           = "ganttProps.features.labels"
        [taskTooltipFeature]      = "ganttProps.features.taskTooltip"
        [taskNonWorkingTimeFeature]="ganttProps.features.taskNonWorkingTime"
        [nonWorkingTimeFeature]="ganttProps.features.nonWorkingTime"
        [eventMenuFeature]="ganttProps.features.eventMenu"
        [scheduleMenuFeature]="ganttProps.features.scheduleMenu"
        [timeAxisHeaderMenuFeature]="ganttProps.features.timeAxisHeaderMenu"
        [cellMenuFeature]="ganttProps.features.cellMenu"
        [taskEditFeature]         = "ganttProps.features.taskEdit"
        [dependenciesFeature]     = "ganttProps.features.dependencies"
        (ready)="onGanttReady($event)"
    ></bryntum-gantt>
      <bryntum-gantt *ngIf="tab === 'Leads' && !isRefreshNeeded"
        id="bryntum-gantt"
        class="bryntum-gantt"
        style="height: 80vh;"
        #gantt
        [columns]                 = "ganttProps.columns"
        [endDate]                 = "ganttProps.endDate"
        [project]                 = "ganttProps.project"
        [startDate]               = "ganttProps.startDate"
        [projectLinesFeature]     = "ganttProps.features.projectLines"
        [scrollButtonsFeature]    = "ganttProps.features.scrollButtons"
        [labelsFeature]           = "ganttProps.features.labels"
        [taskTooltipFeature]      = "ganttProps.features.taskTooltip"
        [taskEditFeature]         = "ganttProps.features.taskEdit"
        [dependenciesFeature]     = "ganttProps.features.dependencies"
        (ready)="onGanttReady($event)"
    ></bryntum-gantt>
       <bryntum-gantt *ngIf="tab === 'Accounts' && !isRefreshNeeded"
        id="bryntum-gantt"
        class="bryntum-gantt"
        style="height: 80vh;"
        #gantt
        [columns]                 = "ganttProps.columns"

        [taskTooltipFeature]      = "ganttProps.features.taskTooltip"
        [taskEditFeature]         = "ganttProps.features.taskEdit"
        [dependenciesFeature]     = "ganttProps.features.dependencies"
        (ready)="onGanttReady($event)"
    ></bryntum-gantt>
</div>
